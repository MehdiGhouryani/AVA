    <script>
      // Suppress unhandled errors from browser extensions (e.g. MetaMask in iframe)
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
          (event.message && (event.message.indexOf('MetaMask') !== -1 || event.message.indexOf('ethereum') !== -1))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1 ||
          msg.indexOf('chrome-extension://') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
