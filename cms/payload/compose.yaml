name: ava-cms-prototype

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ava_cms
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ava_local_only_change_me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ava -d ava_cms"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ava_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ava_local
      MINIO_ROOT_PASSWORD: ava_local_only_change_me
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ava_minio:/data

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 ava_local ava_local_only_change_me &&
      mc mb --ignore-existing local/ava-audio-private"

volumes:
  ava_postgres:
  ava_minio:
